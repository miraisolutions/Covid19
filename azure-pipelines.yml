# Docker - Build and push an image to Azure Container Registry with layer caching

trigger:
- master

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'miraiappregistry'
  imageRepository: 'covid19'
  containerRegistry: 'miraiappregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  DOCKER_BUILDKIT: 1

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      # latest image supposedly is a decent basis for our layer caching
      displayName: Pull image
      inputs:
        command: pull
        containerRegistry: $(dockerRegistryServiceConnection)
        arguments: $(containerRegistry)/$(imageRepository):latest
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        arguments: |
          --cache-from type=registry,ref=$(containerRegistry)/$(imageRepository):latest
          --build-arg BUILDKIT_INLINE_CACHE=1
        tags: |
          $(tag)
          latest
    - task: Docker@2
      displayName: Push an image to container registry
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
